# Base directories
data_dir: '/data/CARD_singlecell/Brain_atlas/PSP_cortex/'
work_dir: '/data/CARD_singlecell/PSP_multiome'


# Reference files
reference_genome: '/fdb/cellranger-arc/refdata-cellranger-arc-GRCh38-2024-A/fasta/genome.fa' 
genome_length: '/fdb/cellranger-arc/refdata-cellranger-arc-GRCh38-2024-A/star/chrNameLength.txt'
metadata: '/input/metadata.csv' # relative to work_dir
gene_list: '/input/first_pass_genes.csv' # relative to work_dir

# Sample parameters
seq_batch_key: 'batch'
sample_key: 'folder_name' 
disease_param: 'Neurological_dx'
control_key: 'control'
diagnoses:
    - PSP
covariates:
    - Age
    - Sex

# QC thresholds
mito_thresh: 15
ribo_thresh: 10
doublet_thresh: 0.15
min_genes: 250
min_peaks: 1000
min_tsse: 2.5

# Cell subtypes
subtypes:
    - MG_DAM
    - L5_IT
    - Astro_proto
    - L2-3_IT
    - Oligo_CSMD1
    - Oligo_RBFOX1
    - OPC
    - VIP
    - Astro_fibrous_DCLK1
    - SST
    - Oligo_OPALIN
    - L5-6_NP
    - L5_ET
    - MG_DIM_PCDH9
    - Chandelier
    - LAMP5
    - L4_IT
    - MG_CAM
    - L6_CT
    - Oligo_CNTN1
    - L6_IT
    - PVALB
    - L6_IT_type_2
    - fibroblasts
    - Astro_reactive
    - MG_homeo
    - pericytes
    - endothelial cells
    - L6b