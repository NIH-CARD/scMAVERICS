# Base directories
data_dir: #'/path/to/your/multiome/data/'
work_dir: #'/path/to/your/working/directory/'

# Slurm partition values, change as needed
## Short GPU node
short_gpu_mem: 200000
short_gpu_model: 'v100x'
short_gpu_time: 1440
short_gpu_num: 1
## Multi GPU node
multi_gpu_mem: 30000
multi_gpu_model: 'v100x'
multi_gpu_time: 2880
multi_gpu_num: 2
## Quick node
quick_time: 180
quick_disk_mem: 200000
quick_mem: 250000
quick_partition: 'quick' 
## Long time node mem_mb=config['long_mem'], runtime=config['long_time']
long_time: 5760
long_mem: 200000
## Large memory node 1
large_1_time: 1440
large_1_mem: 1000000
large_1_partition: 'largemem'
## Large memory node 2
large_2_time: 2880
large_2_mem: 3000000
large_2_partition: 'largemem'

# Reference files
reference_genome: #'/path/to/cellranger-arc/fasta/genome.fa' 
genome_length: #'/path/to/cellranger-arc/star/chrNameLength.txt'
metadata: #'input/metadata.csv' # relative to work_dir
gene_list: #'input/first_pass_genes.csv' # relative to work_dir
cell_cycle_genes: #'input/lab_cell_cycle_genes.txt'
gene_tss: #'/path/to/cellranger-arc/regions/tss.bed'
gene_info: #'/path/to/cellranger-arc/star/geneInfo.tab'
motif_file: #'input/jaspar_2026_hsapiens.meme'
lab_cell_cycle_genes: #'input/lab_cell_cycle_genes'

# Sample parameters
seq_batch_key: #'batch'
sample_key: #'folder_name' 
sex_key: #'Sex' # Column in metadata that contains
disease_param: #'Neurological_dx'
control_key: #'control'
diagnoses:
    - #comparison_1
    - #comparison_2
covariates:
    - Age
    - Sex

# QC thresholds
mito_thresh: 15
ribo_thresh: 10
doublet_thresh: 0.15
min_genes: 250
min_peaks: 1000
min_tsse: 2.5

# Latent space parameters
high_var_gene_num: 2000
high_var_peak_num: 20000
random_number_seed: 0
num_layers: 2
num_latent: 30
max_epoch: 1000
machine_type: 'gpu'

