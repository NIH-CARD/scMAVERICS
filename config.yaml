# Base directories
data_dir: #'/path/to/your/multiome/data/'
work_dir: #'/path/to/your/working/directory/'


# Reference files
reference_genome: #'/path/to/cellranger-arc/fasta/genome.fa' 
genome_length: #'/path/to/cellranger-arc/star/chrNameLength.txt'
metadata: #'input/metadata.csv' # relative to work_dir
gene_list: #'input/first_pass_genes.csv' # relative to work_dir
cell_cycle_genes: #'input/lab_cell_cycle_genes.txt'
gene_tss: #'/path/to/cellranger-arc/regions/tss.bed'
gene_info: #'/path/to/cellranger-arc/star/geneInfo.tab'
motif_file: #'input/jaspar_2024_hsapiens.meme'
lab_cell_cycle_genes: #'input/lab_cell_cycle_genes'

# Sample parameters
seq_batch_key: #'batch'
sample_key: #'folder_name' 
sex_key: #'Sex' # Column in metadata that contains
disease_param: #'Neurological_dx'
control_key: #'control'
diagnoses:
    - #comparison_1
    - #comparison_2
covariates:
    - Age
    - Sex

# QC thresholds
mito_thresh: 15
ribo_thresh: 10
doublet_thresh: 0.15
min_genes: 250
min_peaks: 1000
min_tsse: 2.5

# Latent space parameters
high_var_gene_num: 2000
high_var_peak_num: 20000
random_number_seed: 0
num_layers: 2
num_latent: 30
max_epoch: 1000
machine_type: 'gpu'

