site_name: scMAVERICS
site_author: Adam Catching

site_favicon: img/favicon.ico

theme:
  name: material
  favicon: img/favicon.ico
  logo: img/the_maveric.png
  features:
    - navigation.indexestheme:
  palette:
    - primary: blue grey
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
nav:
  - 0. Introduction: index.md
  - 1. Entire Snakemake pipeline: pipeline.md
  - 2. snRNAseq steps: snRNAseq.md
  - 3. snATACseq steps: snATACseq.md
  - 4. Peak calling: peaks.md
  - 5. Multiome object creation: multiome.md
  - 6. Differential analysis: differential.md
  - 7. ATAC fragment analysis: fragment.md
