# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

# Tell Read the Docs that this is an MkDocs site
mkdocs:
  configuration: mkdocs.yml

# Instruct the build container to read your exact list of plugins/themes
python:
  install:
    - requirements: setup.txt

theme:
  name: material
  favicon: img/favicon.ico

